<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .ticket-exit {
            transition: opacity .3s ease, transform .3s ease, max-height .4s ease, margin .4s ease, padding .4s ease;
            opacity: 0; transform: translateX(-20px) scale(0.95);
            max-height: 0 !important; margin-bottom: -100px;
            padding: 0 !important; overflow: hidden; border: none !important;
        }
        .dd-item { display:block; width:100%; text-align:left; padding:.7rem 1rem; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#4b5563; transition:background .15s; }
        .dd-item:hover { background:#f9fafb; }
        .tab-btn.active { background:white; color:#1f2937; box-shadow:0 1px 3px rgba(0,0,0,.1); }
    </style>
</head>
<body class="font-sans text-gray-800 min-h-screen p-8 pb-32">

<div id="startup-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border border-gray-100">
        <svg class="w-12 h-12 animate-spin text-indigo-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <h2 class="text-lg font-extrabold text-gray-900 mb-2">Connecting to Backend...</h2>
        <p class="text-sm text-gray-500 leading-relaxed mb-4">Waking up the free Render server. This usually takes 30 to 50 seconds.</p>
        <div class="w-full bg-gray-100 rounded-full h-1.5 mb-2 overflow-hidden">
            <div class="bg-indigo-600 h-1.5 rounded-full animate-[pulse_2s_ease-in-out_infinite] w-full origin-left"></div>
        </div>
        <p id="poll-status" class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Initiating connection</p>
    </div>
</div>

<div class="max-w-7xl mx-auto">

    <header class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Sentiment Dashboard</h1>
        <div class="flex items-center gap-4">
            <button id="sim-btn" onclick="startSimulation()" disabled
                class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs font-bold uppercase tracking-wide px-4 py-2 rounded-lg shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Simulate Reviews
            </button>
            <span id="sim-status"
                class="text-xs font-semibold px-3 py-1.5 rounded-full border whitespace-nowrap bg-green-50 text-green-700 border-green-200">
                ✓ Ready
            </span>
            <select id="store-filter" onchange="fetchData()"
                class="bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg text-sm font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                <option value="all">All Stores</option>
            </select>
            <div class="flex items-center gap-2 text-sm text-gray-400">
                <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
                Live
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 flex flex-col items-center text-center">
            <p class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-2">Revenue at Risk</p>
            <p class="text-5xl font-extrabold text-red-500 tracking-tight">$<span id="revenue-amount">0</span></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 flex flex-col items-center text-center">
            <p class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-2">Avg Resolution</p>
            <p class="text-5xl font-extrabold text-blue-500 tracking-tight">
                <span id="ttr-amount">0</span><span class="text-xl font-medium text-gray-400 ml-1">hrs</span>
            </p>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 col-span-2">
            <p class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-3">Shift Bottleneck</p>
            <div class="h-32"><canvas id="shift-chart"></canvas></div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <h2 class="text-base font-bold text-gray-800">Action Desk</h2>
                <span id="open-badge" class="bg-red-50 text-red-600 border border-red-100 text-xs font-bold px-3 py-0.5 rounded-full">0 open</span>
            </div>
            <div class="flex gap-1 bg-gray-100 p-1 rounded-lg">
                <button id="tab-Open"     onclick="setTab('Open')"     class="tab-btn active px-4 py-1 text-xs font-bold rounded-md transition-all">Open</button>
                <button id="tab-Resolved" onclick="setTab('Resolved')" class="tab-btn px-4 py-1 text-xs font-bold rounded-md text-gray-400 transition-all">History</button>
            </div>
        </div>
        <div id="ticket-list" class="bg-gray-50 rounded-b-xl min-h-[400px]"></div>
    </div>

</div>

<div id="toasts" class="fixed bottom-5 right-5 flex flex-col gap-2 z-[999] pointer-events-none"></div>

<div id="dropdown" class="hidden fixed w-40 bg-white rounded-lg shadow-2xl border border-gray-200 z-[9999] overflow-hidden">
    <button id="dd-giftcard" class="dd-item border-b border-gray-100">Send Giftcard</button>
    <button id="dd-convo"    class="dd-item border-b border-gray-100">Start Convo</button>
    <button id="dd-resolve"  class="dd-item text-green-600 hover:bg-green-50">Resolve Issue</button>
</div>

<script>
    const API = 'https://ml-driven-customer-support-system.onrender.com/api';
    //const API = 'http://127.0.0.1:8000/api';
    
    let allTickets = [], currentTab = 'Open', currentRevenue = 0, shiftChart = null;

    // ── Helpers ───────────────────────────────────────────────────────────────

    const $ = id => document.getElementById(id);

    function stars(n) {
        return '★'.repeat(n || 0) + '☆'.repeat(5 - (n || 0));
    }

    function isAnomaly(t) {
        return (t.star_rating >= 4 && t.predicted_sentiment !== 'positive') ||
               (t.star_rating <= 2 && t.predicted_sentiment === 'positive');
    }

    function qs() {
        const v = $('store-filter').value;
        return v !== 'all' ? `?restaurant_id=${v}` : '';
    }

    function formatTimestamp(ts) {
        if (!ts || ts === 'Just now') return ts || '';
        try {
            const d = new Date(ts.replace(' ', 'T'));
            if (isNaN(d)) return ts;
            const now = new Date();
            const diffMs = now - d;
            const diffMin = Math.floor(diffMs / 60000);
            if (diffMin < 1) return 'Just now';
            if (diffMin < 60) return `${diffMin}m ago`;
            const diffHrs = Math.floor(diffMin / 60);
            if (diffHrs < 24) return `${diffHrs}h ago`;
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        } catch (e) { return ts; }
    }

    function animateCounter(id, from, to, ms = 1200) {
        if (from === to) return;
        const el = $(id);
        let start = null;
        const ease = p => 1 - Math.pow(1 - p, 4);
        const step = ts => {
            if (!start) start = ts;
            const p = Math.min((ts - start) / ms, 1);
            el.textContent = Math.floor(ease(p) * (to - from) + from);
            if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }

    function toast(msg) {
        const el = document.createElement('div');
        el.className = 'pointer-events-auto bg-gray-900 text-white text-sm font-medium px-4 py-3 rounded-xl shadow-xl border border-gray-700 flex items-center gap-3 translate-y-4 opacity-0 transition-all duration-300';
        el.innerHTML = `<span class="text-green-400">✓</span> ${msg}`;
        $('toasts').appendChild(el);
        requestAnimationFrame(() => el.classList.remove('translate-y-4', 'opacity-0'));
        setTimeout(() => {
            el.classList.add('opacity-0', 'translate-x-4');
            setTimeout(() => el.remove(), 400);
        }, 3000);
    }

    // ── Dropdown ──────────────────────────────────────────────────────────────

    const dd = $('dropdown');

    function openDropdown(btn, id) {
        $('dd-giftcard').onclick = () => { closeDropdown(); resolveTicket(id, 'Giftcard Sent'); };
        $('dd-convo').onclick    = () => { closeDropdown(); resolveTicket(id, 'Contact Initiated'); };
        $('dd-resolve').onclick  = () => { closeDropdown(); resolveTicket(id, 'Marked Resolved'); };
        const r = btn.getBoundingClientRect();
        dd.style.top  = (window.innerHeight - r.bottom < 140 ? r.top - 140 : r.bottom + 4) + 'px';
        dd.style.left = Math.max(8, r.right - 160) + 'px';
        dd.classList.remove('hidden');
    }

    function closeDropdown() { dd.classList.add('hidden'); }

    document.addEventListener('click', e => {
        if (!dd.contains(e.target) && !e.target.closest('.action-btn')) closeDropdown();
    });

    // ── Chart ─────────────────────────────────────────────────────────────────

    function updateChart(data) {
        const ctx = $('shift-chart').getContext('2d');
        if (shiftChart) {
            shiftChart.data.datasets[0].data = Object.values(data);
            shiftChart.update();
            return;
        }
        shiftChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(data),
                datasets: [{ data: Object.values(data), backgroundColor: 'rgba(239,68,68,.8)', borderRadius: 5, borderSkipped: false }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { precision: 0, color: '#94a3b8' }, border: { display: false } },
                    x: { ticks: { color: '#64748b', font: { weight: 'bold' } }, grid: { display: false }, border: { display: false } }
                }
            }
        });
    }

    // ── Tabs ──────────────────────────────────────────────────────────────────

    function setTab(tab) {
        currentTab = tab;
        ['Open', 'Resolved'].forEach(t => {
            $(`tab-${t}`).classList.toggle('active', t === tab);
            $(`tab-${t}`).classList.toggle('text-gray-400', t !== tab);
        });
        renderTickets();
    }

    // ── Render ────────────────────────────────────────────────────────────────

    function colHeader(label, count, infoTip = null) {
        const info = infoTip ? `
            <div class="relative group ml-1">
                <button class="w-4 h-4 rounded-full border border-gray-400 text-gray-400 hover:border-blue-400 hover:text-blue-400 text-[9px] font-black flex items-center justify-center leading-none transition-colors">i</button>
                <div class="absolute right-0 top-full mt-2 w-60 bg-gray-900 text-gray-300 text-[11px] leading-relaxed rounded-lg p-3 shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 pointer-events-none">
                    <p class="font-bold text-yellow-300 uppercase tracking-wide text-[9px] mb-1">Model Training Signal</p>
                    ${infoTip}
                </div>
            </div>` : '';
        return `
            <div class="sticky top-0 z-10 px-5 py-3 bg-gray-100/90 backdrop-blur-sm border-b border-gray-200 flex items-center justify-between">
                <div class="flex items-center gap-1">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-600">${label}</span>
                    ${info}
                </div>
                <span class="bg-gray-300 text-gray-700 text-[10px] font-bold px-2 py-0.5 rounded-full">${count}</span>
            </div>`;
    }

    function renderTicket(t) {
        const badge = isAnomaly(t)
            ? `<span class="text-[9px] font-black uppercase tracking-widest text-yellow-700 bg-yellow-50 border border-yellow-200 px-2 py-0.5 rounded mb-2 inline-block">Anomaly / Sarcasm Detected</span>`
            : '';

        const right = currentTab === 'Open'
            ? `<button onclick="openDropdown(this,${t.review_id})" class="action-btn flex-shrink-0 ml-4 flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide bg-white border border-gray-300 text-gray-600 hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded-lg shadow-sm transition-all whitespace-nowrap">
                    Action <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
               </button>`
            : `<span class="flex-shrink-0 ml-4 text-[10px] font-semibold text-gray-400 bg-gray-100 border border-gray-200 px-2 py-1 rounded whitespace-nowrap">${formatTimestamp(t.resolved_at)}</span>`;

        return `
            <div id="ticket-${t.review_id}" class="p-5 bg-white border-b border-gray-100 hover:bg-slate-50 transition-colors">
                ${badge}
                <div class="flex items-start justify-between">
                    <div class="min-w-0 flex-grow pr-4">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-gray-900 text-sm">${t.restaurant_name}</span>
                            <span class="text-yellow-400 text-[10px] tracking-widest">${stars(t.star_rating)}</span>
                        </div>
                        <p class="text-sm text-gray-500 leading-relaxed mb-2">"${t.review_text}"</p>
                        <span class="text-[10px] text-gray-400">${t.review_timestamp}</span>
                    </div>
                    ${right}
                </div>
            </div>`;
    }

    function renderTickets() {
        const el = $('ticket-list');
        closeDropdown();

        if (currentTab === 'Resolved') {
            const tix = allTickets
                .filter(t => t.ticket_status === 'Resolved')
                .sort((a, b) => {
                    const ta = a.resolved_at === 'Just now' ? Date.now() : new Date(a.resolved_at.replace(' ', 'T'));
                    const tb = b.resolved_at === 'Just now' ? Date.now() : new Date(b.resolved_at.replace(' ', 'T'));
                    return tb - ta;
                });
            el.innerHTML = colHeader('Resolved Issues', tix.length)
                + (tix.length
                    ? tix.map(renderTicket).join('')
                    : '<p class="p-10 text-center text-gray-400 text-sm">No resolved history.</p>');
            return;
        }

        const open      = allTickets.filter(t => t.ticket_status === 'Open');
        const anomalies = open.filter(isAnomaly)
                              .sort((a, b) => new Date(b.review_timestamp.replace(' ', 'T')) - new Date(a.review_timestamp.replace(' ', 'T')));
        const standard  = open.filter(t => !isAnomaly(t))
                              .sort((a, b) => new Date(b.review_timestamp.replace(' ', 'T')) - new Date(a.review_timestamp.replace(' ', 'T')));

        if (!open.length) {
            el.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-center">
                <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                </svg>
                <p class="text-lg font-bold text-gray-800 mb-1">No reviews yet</p>
                <p class="text-sm text-gray-400">Click <strong>Simulate Reviews</strong> above to start the demo.</p>
            </div>`;
            return;
        }

        const infoText = 'Edge cases where the model\'s predicted sentiment conflicts with the star rating \u2014 likely sarcasm or informal language. Useful labelled data for future training cycles.';

        el.innerHTML = `
            <div class="grid grid-cols-1 lg:grid-cols-2 divide-x divide-gray-200">
                <div>
                    ${colHeader('Standard Tickets', standard.length)}
                    ${standard.length ? standard.map(renderTicket).join('') : '<p class="p-8 text-center text-sm text-gray-400">No standard issues pending.</p>'}
                </div>
                <div class="bg-yellow-50/20">
                    ${colHeader('Anomalies & Sarcasm', anomalies.length, infoText)}
                    ${anomalies.length ? anomalies.map(renderTicket).join('') : '<p class="p-8 text-center text-sm text-gray-400">No anomalies detected.</p>'}
                </div>
            </div>`;
    }

    // ── Data ──────────────────────────────────────────────────────────────────

    async function loadRestaurants() {
        try {
            const { restaurants } = await fetch(`${API}/restaurants`).then(r => r.json());
            const sel = $('store-filter');
            restaurants.forEach(r => {
                const o = document.createElement('option');
                o.value = r.restaurant_id;
                o.textContent = `${r.name} (${r.location_tag})`;
                sel.appendChild(o);
            });
        } catch (e) { console.error(e); }
    }

    async function fetchData() {
        try {
            const q = qs();
            const [metrics, { tickets }] = await Promise.all([
                fetch(`${API}/dashboard${q}`).then(r => r.json()),
                fetch(`${API}/tickets${q}`).then(r => r.json())
            ]);
            
            if (currentRevenue !== metrics.revenue_at_risk) {
                animateCounter('revenue-amount', currentRevenue, metrics.revenue_at_risk);
                currentRevenue = metrics.revenue_at_risk;
            }
            $('ttr-amount').textContent = metrics.avg_ttr_hours;
            $('open-badge').textContent = `${metrics.open_tickets} open`;
            updateChart(metrics.heatmap_data);
            allTickets = tickets;
            renderTickets();
        } catch (e) { 
            console.error("Fetch failed.", e); 
        }
    }

    async function resolveTicket(id, label) {
        const card = $(`ticket-${id}`);
        if (card) card.classList.add('ticket-exit');
        setTimeout(() => {
            allTickets = allTickets.map(t =>
                t.review_id === id ? { ...t, ticket_status: 'Resolved', resolved_at: 'Just now' } : t
            );
            renderTickets();
            toast(label);
        }, 320);
        try {
            const res = await fetch(`${API}/tickets/${id}/resolve`, { method: 'PATCH' });
            if (!res.ok) throw new Error('Resolve failed');
            fetchData();
        } catch (e) {
            console.error(e);
            fetchData();
        }
    }

    // ── Simulation ────────────────────────────────────────────────────────────

    function formatCountdown(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    async function startSimulation() {
        const btn = $('sim-btn');
        const pill = $('sim-status');
        btn.disabled = true;
        pill.textContent = 'Resetting...';
        pill.className = 'text-xs font-semibold px-3 py-1.5 rounded-full border whitespace-nowrap bg-gray-50 text-gray-500 border-gray-200';
        try {
            // Wipe old data first so we get a fresh demo
            await fetch(`${API}/reset`, { method: 'POST' });
            // Refresh UI to show empty state briefly
            await fetchData();

            pill.textContent = 'Starting...';
            const res = await fetch(`${API}/simulation/start`, { method: 'POST' });
            const data = await res.json();
            if (data.status === 'already_running') {
                fetchSimulationStatus();
            }
        } catch (e) {
            console.error('Simulation start failed:', e);
            pill.textContent = '⚠ Simulation failed';
            pill.className = 'text-xs font-semibold px-3 py-1.5 rounded-full border whitespace-nowrap bg-red-50 text-red-600 border-red-200';
            btn.disabled = false;
        }
    }

    async function fetchSimulationStatus() {
        try {
            const data = await fetch(`${API}/simulation/status`).then(r => r.json());
            const btn  = $('sim-btn');
            const pill = $('sim-status');

            if (data.phase === 'seeding') {
                btn.disabled = true;
                pill.textContent = `Seeding ${data.reviews_sent}/${data.total_reviews} reviews...`;
                pill.className = 'text-xs font-semibold px-3 py-1.5 rounded-full border whitespace-nowrap bg-yellow-50 text-yellow-700 border-yellow-200 animate-pulse';
                fetchData();

            } else if (data.phase === 'live') {
                btn.disabled = true;
                pill.textContent = `● Simulating ${data.reviews_sent}/12 | ${formatCountdown(data.remaining_seconds)}`;
                pill.className = 'text-xs font-semibold px-3 py-1.5 rounded-full border whitespace-nowrap bg-blue-50 text-blue-700 border-blue-200';
                fetchData();

            } else if (data.phase === 'error') {
                btn.disabled = false;
                pill.textContent = '⚠ Simulation failed';
                pill.className = 'text-xs font-semibold px-3 py-1.5 rounded-full border whitespace-nowrap bg-red-50 text-red-600 border-red-200';

            } else {
                if (pill.textContent !== '✓ Ready') fetchData();
                btn.disabled = false;
                pill.textContent = '✓ Ready';
                pill.className = 'text-xs font-semibold px-3 py-1.5 rounded-full border whitespace-nowrap bg-green-50 text-green-700 border-green-200';
            }
        } catch (e) { console.error('Status poll error:', e); }
    }

    // ── Safe Bootup Sequence ──────────────────────────────────────────────────

    let isServerAwake = false;

    async function waitForServer() {
        if (isServerAwake) return;

        $('poll-status').textContent = "Pinging server...";
        
        try {
            // Use AbortSignal to enforce a 5-second timeout on the fetch
            const res = await fetch(`${API}/restaurants`, { 
                signal: AbortSignal.timeout(5000) 
            });
            
            if (res.ok) {
                isServerAwake = true;
                $('startup-overlay').style.opacity = '0';
                setTimeout(() => $('startup-overlay').classList.add('hidden'), 500);
                toast('Server is online and ready!');
                
                // Wipe old data so every page load is a fresh start
                await fetch(`${API}/reset`, { method: 'POST' });
                
                // Now that we are safe, load the real data
                loadRestaurants();
                fetchData();
                fetchSimulationStatus();
                
                // Enable the simulate button now that server is confirmed awake
                $('sim-btn').disabled = false;
                
                // Start background polling
                setInterval(fetchData, 10000);
                setInterval(fetchSimulationStatus, 3000);
                return;
            }
        } catch (e) {
            // Request timed out or failed. The server is still booting.
            $('poll-status').textContent = "Server sleeping. Retrying in 5s...";
            setTimeout(waitForServer, 5000); // Try again in 5 seconds
        }
    }

    // Start the safe boot sequence immediately on load
    waitForServer();

</script>
</body>
</html>
